<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GAWANG MINI JONG CANNO CUP U19 - Season 2 2026</title>
  <meta name="description" content="Website Resmi Turnamen Gawang Mini Jong Canno Cup U19 Season 2 2026 - Maluku.">
  
  <link rel="icon" type="image/png" href="https://iili.io/KhDMwdb.png">
  <meta property="og:title" content="GAWANG MINI JONG CANNO CUP U19 - Season 2 2026">
  <meta property="og:description" content="Jadwal, Hasil Pertandingan, Klasemen Top Skor, Data Tim & Pemain Jong Canno Cup U19.">
  <meta property="og:image" content="https://iili.io/KhDMwdb.png">

  <!-- Google Fonts: Oswald & Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              navyDark: '#1a1a2e',
              navyDeep: '#16213e',
              navyMid: '#0f3460',
              gold: '#febe10',
              goldHover: '#e5ab0e',
              emerald: '#10b981',
              accentRed: '#ef4444',
            }
          },
          fontFamily: {
            oswald: ['Oswald', 'sans-serif'],
            roboto: ['Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1a1a2e; }
    ::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #febe10; }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #ffffff;
      background-attachment: fixed;
      overflow-x: hidden;
    }

    .bg-pattern {
      background-image: radial-gradient(rgba(254, 190, 16, 0.08) 1px, transparent 1px), radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .glass-card-hover { transition: all 0.3s ease; }
    .glass-card-hover:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(254, 190, 16, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
    }

    .glass-header {
      background: rgba(26, 26, 46, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-modal {
      background: rgba(22, 33, 62, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(254, 190, 16, 0.25);
    }

    .score-glow {
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 35px rgba(254, 190, 16, 0.3);
    }

    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      animation: pulse-red 1.5s infinite;
    }
    @keyframes pulse-red {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #febe10 0%, #e5ab0e 100%);
      color: #1a1a2e;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(254, 190, 16, 0.35);
    }

    #sidebar-drawer { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  </style>
</head>
<body class="bg-pattern text-slate-100 flex flex-col min-h-screen">

  <!-- HEADER -->
  <header class="sticky top-0 z-40 w-full glass-header shadow-lg">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2.5 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 sm:gap-3">
        <button id="btn-toggle-menu" onclick="toggleSidebar()" aria-label="Buka Menu" class="p-2 rounded-xl text-brand-gold hover:text-white bg-white/5 hover:bg-white/10 border border-white/10 transition flex items-center justify-center focus:outline-none">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>

        <a href="javascript:void(0)" onclick="navigateTo('beranda')" class="flex items-center gap-2 group cursor-pointer" title="Kembali ke Beranda">
          <div class="relative w-9 h-9 sm:w-11 sm:h-11 rounded-full p-0.5 bg-gradient-to-tr from-brand-gold to-yellow-200 shadow-md group-hover:scale-105 transition-transform flex-shrink-0">
            <img src="https://iili.io/KhDMwdb.png" alt="Logo Jong Canno Cup" class="w-full h-full object-contain rounded-full bg-[#1a1a2e]">
          </div>
          <div class="flex flex-col">
            <span class="font-oswald font-bold text-sm sm:text-lg tracking-wider text-white group-hover:text-brand-gold transition leading-tight">
              JONG CANNO CUP
            </span>
            <span class="text-[10px] sm:text-xs text-brand-gold/90 font-medium tracking-widest uppercase">
              U19 • SEASON 2 2026
            </span>
          </div>
        </a>
      </div>

      <div class="flex items-center gap-2 sm:gap-4">
        <div class="text-right flex flex-col justify-center">
          <div class="flex items-center justify-end gap-1.5 text-[11px] sm:text-xs text-slate-300 font-medium">
            <i class="fa-regular fa-calendar text-brand-gold text-[10px] sm:text-xs"></i>
            <span id="realtime-date" class="font-roboto">Memuat tanggal...</span>
          </div>
          <div class="flex items-center justify-end gap-1.5 text-xs sm:text-sm font-oswald font-bold text-brand-gold tracking-wide">
            <span class="live-dot"></span>
            <span id="realtime-time" class="tracking-widest">00:00:00 WIT</span>
          </div>
        </div>

        <button onclick="openSyncModal()" title="Sinkronisasi Data Cloud" class="p-2 sm:px-3 sm:py-1.5 rounded-xl bg-brand-navyMid/70 hover:bg-brand-navyMid text-slate-200 hover:text-brand-gold border border-white/15 transition flex items-center gap-1.5 text-xs font-semibold">
          <i class="fa-solid fa-cloud-arrow-up text-brand-gold"></i>
          <span class="hidden md:inline">Sync Cloud</span>
        </button>

        <button onclick="openAdminModal()" title="Panel Admin (Password: qwerty)" class="p-2 sm:px-3.5 sm:py-1.5 rounded-xl bg-gradient-to-r from-amber-500/20 to-yellow-500/20 hover:from-amber-500/30 hover:to-yellow-500/30 border border-brand-gold/40 text-brand-gold hover:text-white transition flex items-center gap-1.5 text-xs sm:text-sm font-bold shadow-sm">
          <i class="fa-solid fa-shield-halved text-brand-gold"></i>
          <span class="hidden sm:inline">Admin</span>
        </button>
      </div>
    </div>
  </header>

  <!-- SIDEBAR DRAWER -->
  <div id="sidebar-backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300"></div>

  <nav id="sidebar-drawer" class="fixed top-0 left-0 h-full w-72 sm:w-80 bg-[#16213e] border-r border-brand-gold/30 z-50 transform -translate-x-full shadow-2xl flex flex-col justify-between">
    <div>
      <div class="p-4 border-b border-white/10 flex items-center justify-between bg-[#1a1a2e]">
        <div class="flex items-center gap-3">
          <img src="https://iili.io/KhDMwdb.png" alt="Logo" class="w-10 h-10 rounded-full border border-brand-gold p-0.5 object-contain">
          <div>
            <h3 class="font-oswald font-bold text-white text-base leading-tight">JONG CANNO CUP</h3>
            <p class="text-[11px] text-brand-gold">Turnamen Gawang Mini U19</p>
          </div>
        </div>
        <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-white/10 transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="p-3 space-y-1 overflow-y-auto max-h-[calc(100vh-140px)]">
        <button onclick="navigateTo('beranda')" class="nav-item w-full flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-200 hover:bg-white/10 hover:text-brand-gold transition text-left">
          <i class="fa-solid fa-house w-5 text-brand-gold"></i>
          <span>Beranda</span>
        </button>
        <button onclick="navigateTo('jadwal')" class="nav-item w-full flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-200 hover:bg-white/10 hover:text-brand-gold transition text-left">
          <i class="fa-solid fa-calendar-days w-5 text-brand-gold"></i>
          <span>Jadwal & Hasil</span>
        </button>
        <button onclick="navigateTo('topskor')" class="nav-item w-full flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-200 hover:bg-white/10 hover:text-brand-gold transition text-left">
          <i class="fa-solid fa-trophy w-5 text-brand-gold"></i>
          <span>Top Skor (32 Besar+)</span>
        </button>
        <button onclick="navigateTo('tim')" class="nav-item w-full flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-200 hover:bg-white/10 hover:text-brand-gold transition text-left">
          <i class="fa-solid fa-users-viewfinder w-5 text-brand-gold"></i>
          <span>Daftar Tim & Pemain</span>
        </button>
        <button onclick="navigateTo('ulangtahun')" class="nav-item w-full flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-200 hover:bg-white/10 hover:text-brand-gold transition text-left">
          <i class="fa-solid fa-cake-candles w-5 text-brand-gold"></i>
          <span>Ulang Tahun Pemain</span>
        </button>
        <button onclick="navigateTo('pengumuman')" class="nav-item w-full flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-200 hover:bg-white/10 hover:text-brand-gold transition text-left">
          <i class="fa-solid fa-bullhorn w-5 text-brand-gold"></i>
          <span>Pengumuman</span>
        </button>

        <div class="pt-2 pb-1">
          <div class="border-t border-white/10 my-1"></div>
          <span class="text-[10px] uppercase font-bold text-slate-400 px-3 tracking-wider">Link Eksternal & Bagan</span>
        </div>

        <button onclick="navigateTo('bagan')" class="nav-item w-full flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-200 hover:bg-white/10 hover:text-brand-gold transition text-left">
          <i class="fa-solid fa-sitemap w-5 text-brand-gold"></i>
          <span>Bagan Turnamen (Canva)</span>
        </button>
        <button onclick="navigateTo('aturan')" class="nav-item w-full flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-200 hover:bg-white/10 hover:text-brand-gold transition text-left">
          <i class="fa-solid fa-file-shield w-5 text-brand-gold"></i>
          <span>Aturan & Regulasi (Drive)</span>
        </button>

        <div class="pt-2 pb-1">
          <div class="border-t border-white/10 my-1"></div>
          <span class="text-[10px] uppercase font-bold text-slate-400 px-3 tracking-wider">Manajemen & Cloud</span>
        </div>

        <button onclick="openAdminModal()" class="w-full flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm font-bold text-amber-300 hover:bg-brand-gold/20 hover:text-white transition text-left">
          <i class="fa-solid fa-lock w-5 text-amber-400"></i>
          <span>Panel Admin (qwerty)</span>
        </button>
        <button onclick="openSyncModal()" class="w-full flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm font-medium text-emerald-400 hover:bg-emerald-500/20 transition text-left">
          <i class="fa-solid fa-cloud-arrow-down w-5 text-emerald-400"></i>
          <span>Bagikan / Sinkronisasi</span>
        </button>
      </div>
    </div>

    <div class="p-3 border-t border-white/10 bg-[#1a1a2e] text-center">
      <p class="text-[11px] text-slate-400">Gawang Mini Jong Canno Cup U19</p>
      <p class="text-[10px] text-brand-gold font-medium">Digital Football Management • Maluku</p>
    </div>
  </nav>

  <!-- MAIN SECTIONS -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-3 sm:px-6 py-4 sm:py-6">
    <!-- Konten Beranda, Jadwal, Top Skor, Tim, Aturan, Bagan, Ulang Tahun, Pengumuman terpasang lengkap -->
  </main>
</body>
</html>
